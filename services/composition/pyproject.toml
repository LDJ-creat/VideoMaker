[project]
name = "videomaker-composition"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "referencing>=0.35",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
acp = ["agent-client-protocol>=0.10"]
all = ["mcp>=1.0", "agent-client-protocol>=0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../shared"]
